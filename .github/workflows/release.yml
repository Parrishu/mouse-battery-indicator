name: Release
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  attestations: write
  contents: write    

jobs:
  release:
    runs-on: windows-2022
    environment: actions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"

      - run: cargo test --release --lib
      - run: cargo build --release
      - run: cargo build --release --bin mouse-battery-indicator-portable --features portable

      - run: ISCC ./installer.iss
            # result in ./Output/MouseBatteryIndicatorSetup.exe
      - run: cp target/release/mouse-battery-indicator-portable.exe ./Output/MouseBatteryIndicatorPortable.exe

      - name: Sign executable
        env:
          CERTIFICATE_PFX_BASE64: ${{ secrets.CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            Write-Warning "Signing certificate secrets are not configured; publishing unsigned executables."
            exit 0
          }

          $certificatePath = Join-Path $PWD "certificate_from_secret.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:CERTIFICATE_PFX_BASE64)
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

            $signTool = Get-ChildItem -Path "C:\Program Files*\Windows Kits\*\bin\*\x64\signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $signTool) {
              throw "Windows SDK SignTool was not found."
            }

            foreach ($file in @("Output/MouseBatteryIndicatorSetup.exe", "Output/MouseBatteryIndicatorPortable.exe")) {
              & $signTool.FullName sign /f $certificatePath /p $env:CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file
              if ($LASTEXITCODE -ne 0) {
                throw "SignTool failed to sign $file (exit code $LASTEXITCODE)."
              }
            }
          }
          finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            Output/MouseBatteryIndicatorSetup.exe
            Output/MouseBatteryIndicatorPortable.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/MouseBatteryIndicatorSetup.exe
            Output/MouseBatteryIndicatorPortable.exe
          body_path: "changelog/${{github.ref_name}}.md"
          draft: false
          name: Release ${{github.ref_name}}
