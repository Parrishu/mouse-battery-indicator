[package]
name = "mouse-battery-indicator"
version = "1.0.4"
edition = "2024"
authors = ["Parrishu"]
description = "Displays Logitech HID++ battery levels in the Windows system tray."
license = "GPL-3.0-only"
homepage = "https://github.com/Parrishu/mouse-battery-indicator"
default-run = "mouse-battery-indicator-debug"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "mouse-battery-indicator-debug"
path = "src/bin/debug.rs"

[[bin]]
name = "mouse-battery-indicator"
path = "src/main.rs"

[[bin]]
name = "mouse-battery-indicator-portable"
path = "src/main.rs"
required-features = ["portable"]

[features]
default = []
portable = []

[dependencies]
anyhow = "1.0.102"
log = "0.4.22"
win32_notif = "0.15.2"
serde = "1.0.219"
serde_derive = "1.0.228"
serde_json = "1.0.145"
simplelog = { version = "0.12.2", features = ["paris"] }
sys-locale = "0.3.2"
tray-icon = "0.25.1"
winit = "0.30.12"
winreg = { version = "0.56.0", features = ["serialization-serde"] }
ureq = { version = "3.3.0", features = ["json"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
libc = "0.2.186"
toml = { version = "1.1.6", features = ["parse", "std", "serde", "display"], default-features = false }

[build-dependencies]
winres = "0.1"
cc = { version = "1.2.61", features = ["jobserver"] }

[profile.release]
opt-level = "z"
lto = true
